<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alquimistic Hub — Business OS</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="bos.css" />
</head>
<body>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="side" id="side">
    <div class="side-brand">
      <span class="side-badge"><img src="assets/logo.png" alt="Alquimistic Hub" /></span>
      <span class="nm">Alquimistic<span class="sub">Business OS</span></span>
    </div>

    <button class="side-search" id="sideSearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/></svg>
      Buscar o preguntar…
      <span class="kbd">⌘K</span>
    </button>

    <nav class="side-nav" id="sideNav"></nav>

    <div class="side-foot">
      <div class="side-upgrade">
        <div class="h">Plan Hub Alquimia</div>
        <div class="p">Has usado 12 de 15 usuarios.</div>
        <div class="bar"><i></i></div>
        <button class="btn btn-primary btn-sm" style="width:100%">Ampliar plan</button>
      </div>
      <button class="side-user">
        <span class="avatar">CR</span>
        <span class="meta"><span class="n">Camila Restrepo</span><span class="r">Fundadora · CEO</span></span>
        <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim"></div>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="top-title">
        <h1 id="topTitle">Panel</h1>
        <div class="crumb" id="topCrumb"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="topSearch" title="Buscar (⌘K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/></svg></button>
        <button class="icon-btn has-dot" title="Notificaciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <button class="icon-btn" id="themeToggle" title="Cambiar tema"></button>
        <button class="btn btn-primary btn-sm" id="topSearch2" data-ai-open><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4z"/></svg><span>Asistente IA</span></button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- ============ AI ASSISTANT (triangle) ============ -->
<button class="ai-fab" id="aiFab" aria-label="Abrir asistente IA">
  <span class="ping"></span>
  <span class="tri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4z"/></svg></span>
</button>

<div class="scrim" id="aiScrim"></div>
<aside class="ai-panel" id="aiPanel" aria-label="Asistente IA">
  <div class="ai-head">
    <span class="tri-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4z"/></svg></span>
    <span class="nm">Asistente Alquimistic<span class="s">● Conectado a tu negocio</span></span>
    <button class="icon-btn x" id="aiClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="ai-body" id="aiBody"></div>
  <div class="ai-foot">
    <div class="ai-input">
      <input id="aiInput" placeholder="Escribe o pregunta lo que quieras…" />
      <button class="ai-send" id="aiSend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </div>
</aside>

<!-- ============ COMMAND PALETTE ============ -->
<div class="cmdk-scrim" id="cmdkScrim">
  <div class="cmdk">
    <div class="cmdk-in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/></svg>
      <input id="cmdkInput" placeholder="Busca módulos, acciones o pregunta a la IA…" />
      <span class="esc">ESC</span>
    </div>
    <div class="cmdk-list" id="cmdkList"></div>
  </div>
</div>

<script src="bos-icons.js"></script>
<script src="bos-data.js"></script>
<script src="bos-modules.js"></script>
<script src="bos-app.js"></script>
</body>
</html>
